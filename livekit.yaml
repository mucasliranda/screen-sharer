port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50060
  # Em Docker Desktop o container nao ve o IP do host. Como as portas sao
  # publicadas em localhost e o navegador roda no host, anunciar 127.0.0.1
  # faz o candidato ICE funcionar para desenvolvimento local.
  use_external_ip: false
  node_ip: 127.0.0.1

keys:
  devkey: secret-de-desenvolvimento-com-32-chars-min

# Webhooks: a origem do controle de uso. O container precisa alcancar o Next
# rodando no host, dai o host.docker.internal (o docker-compose mapeia).
# A assinatura usa a chave/segredo acima; a rota valida com WebhookReceiver.
#
# Em LiveKit Cloud este bloco nao vale: configure em
# Settings > Webhooks, apontando para https://<seu-dominio>/api/livekit/webhook
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3000/api/livekit/webhook
